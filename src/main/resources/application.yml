spring:
  application:
    name: tvmaze-middleware
  jackson:
    default-property-inclusion: always
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tvmaze_middleware}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

tvmaze:
  base-url: ${TVMAZE_BASE_URL:https://api.tvmaze.com}
  connect-timeout: 3s
  read-timeout: 10s
  cache:
    maximum-size: 500
    time-to-live: 10m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.tvmaze: INFO
